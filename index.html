<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Scanner - PT. Daya Sakti Niaga</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      :root {
        --primary: #8b5cf6; --primary-light: #a78bfa; --secondary: #3b82f6;
        --accent: #ec4899; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
        --glass-bg: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.15);
        --glass-blur: blur(20px); --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.7); --text-muted: rgba(255, 255, 255, 0.4);
        --radius-lg: 24px; --radius-md: 16px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        width: 100%; max-width: 100vw; overflow-x: hidden; overscroll-behavior-y: none;
        background: radial-gradient(circle at 15% 50%, #1e1b4b, transparent 50%),
                    radial-gradient(circle at 85% 30%, #312e81, transparent 50%),
                    radial-gradient(circle at 50% 80%, #0f172a, transparent 50%);
        background-color: #020617; background-attachment: fixed; color: var(--text-primary);
        font-family: "Plus Jakarta Sans", sans-serif; min-height: 100dvh; display: flex; flex-direction: column;
      }
      .topbar {
        background: rgba(2, 6, 23, 0.6); backdrop-filter: var(--glass-blur); border-bottom: 1px solid var(--glass-border);
        padding: max(16px, env(safe-area-inset-top)) 20px 16px; display: flex; justify-content: space-between; position: sticky; top: 0; z-index: 100;
      }
      .topbar-title { font-size: 1.15rem; font-family: "Space Grotesk", sans-serif; font-weight: 700; color: white; }
      
      .bottom-nav {
        position: fixed; bottom: 0; width: 100%; background: rgba(15, 23, 42, 0.95);
        border-top: 1px solid var(--glass-border); display: flex; justify-content: space-around;
        padding: 12px 10px calc(12px + env(safe-area-inset-bottom)) 10px; z-index: 999;
      }
      .nav-item { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--text-muted); cursor: pointer; flex: 1; }
      .nav-item.active { color: var(--primary-light); }
      .nav-item.active i { transform: translateY(-3px) scale(1.1); color: var(--primary-light); }
      
      .view-page { display: none; opacity: 0; animation: fadeIn 0.4s forwards; }
      .view-page.active { display: flex; flex-direction: column; gap: 24px; opacity: 1; padding: 20px 16px 120px; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      
      .card { background: var(--glass-bg); backdrop-filter: var(--glass-blur); border-radius: var(--radius-lg); padding: 24px; border: 1px solid var(--glass-border); }
      .card-header { font-weight: 700; margin-bottom: 24px; font-size: 1.15rem; display: flex; align-items: center; gap: 12px; }
      
      /* SCANNER REVISION */
      #reader { width: 100%; border-radius: var(--radius-md); overflow: hidden; background: #000; }
      #reader video { object-fit: cover; }
      
      .floating-controls {
        display: flex; gap: 12px; background: rgba(15, 23, 42, 0.9); padding: 8px; border-radius: 100px;
        margin-top: 10px; border: 1px solid rgba(255, 255, 255, 0.1); justify-content: space-between; width: 100%;
      }
      .btn { border: none; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; min-height: 50px; border-radius: var(--radius-md); }
      .btn-scan { flex: 1; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border-radius: 100px;}
      .btn-scan.stop { background: linear-gradient(135deg, var(--danger), #be123c); }
      
      .input-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; }
      .form-control { width: 100%; padding: 16px; border: 1px solid var(--glass-border); border-radius: var(--radius-md); background: rgba(0, 0, 0, 0.2); color: white; font-size: 16px;}
      
      .table-wrapper { width: 100%; overflow-x: auto; background: rgba(0, 0, 0, 0.2); border-radius: var(--radius-md); max-height: 60vh; }
      table { width: 100%; border-collapse: collapse; white-space: nowrap; }
      th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.9rem; }
      th { background: rgba(255, 255, 255, 0.1); position: sticky; top: 0; }
      
      /* SWIPE TO DELETE SIMULATION (Visual cue) */
      .swipe-delete-btn { color: white; background: var(--danger); border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
      
      .btn-export-big { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); color: white; width: 100%; padding: 24px; border-radius: var(--radius-lg); margin-bottom: 16px; text-align: left; display: flex; gap: 15px; align-items: center;}
      .btn-export-big.excel { color: #34d399; }
      .btn-export-big.pdf { color: #f87171; }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="topbar-title"><i class="fas fa-qrcode"></i> PT. Daya Sakti Niaga</div>
      <div id="engineBadge" style="font-size: 0.7rem; color: #34d399;">PRO ENGINE</div>
    </div>

    <div id="view-scan" class="view-page active">
      <div class="card">
        <div class="card-header"><i class="fas fa-camera"></i> Pindai Barcode</div>
        <div id="reader"></div>
        <div class="floating-controls">
          <button class="btn btn-scan" id="btnAction" onclick="toggleScan()">
            <i class="fas fa-play" style="margin-right: 6px"></i> MULAI SCAN
          </button>
        </div>
        <div class="input-group" style="margin-top: 20px">
          <label>Input Manual</label>
          <div style="display: flex; gap: 10px;">
            <input type="text" id="manualData" class="form-control" placeholder="Ketik barcode..." />
            <button class="btn" style="background: var(--secondary); color: white; padding: 0 20px;" onclick="inputManual()"><i class="fas fa-plus"></i></button>
          </div>
        </div>
      </div>
    </div>

    <div id="view-session" class="view-page">
      <div class="card">
        <div class="card-header"><i class="fas fa-list"></i> Data Hari Ini</div>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Aksi</th><th>Kode</th><th>Panjang</th><th>Lebar</th><th>Potongan</th><th>Jam</th></tr></thead>
            <tbody id="tableToday"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="view-database" class="view-page">
      <div class="card">
        <div class="card-header"><i class="fas fa-database"></i> Master Barang</div>
        <div class="input-group">
          <input type="search" class="form-control" id="search" placeholder="Cari barcode..." onkeyup="renderDatabase()" />
        </div>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Aksi</th><th>Kode</th><th>Panjang</th><th>Lebar</th><th>Tgl</th><th>Jam</th></tr></thead>
            <tbody id="tableAll"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="view-export" class="view-page">
      <div class="card">
        <div class="card-header"><i class="fas fa-download"></i> Ekspor Laporan</div>
        <button class="btn btn-export-big excel" onclick="exportData('excel', 'today')">
          <i class="fas fa-file-excel fa-2x"></i> <div><strong>Excel Hari Ini</strong><br><small>Unduh sesi aktif</small></div>
        </button>
        <button class="btn btn-export-big excel" onclick="exportData('excel', 'all')">
          <i class="fas fa-file-excel fa-2x"></i> <div><strong>Excel Master Data</strong><br><small>Semua riwayat</small></div>
        </button>
        <button class="btn btn-export-big pdf" onclick="exportData('pdf', 'today')">
          <i class="fas fa-file-pdf fa-2x"></i> <div><strong>PDF Hari Ini</strong><br><small>Laporan siap cetak</small></div>
        </button>
      </div>
    </div>

    <nav class="bottom-nav">
      <a class="nav-item active" onclick="switchPage('view-scan', this)"><i class="fas fa-qrcode"></i><span>Scan</span></a>
      <a class="nav-item" onclick="switchPage('view-session', this)"><i class="fas fa-clipboard-check"></i><span>Hari Ini</span></a>
      <a class="nav-item" onclick="switchPage('view-database', this)"><i class="fas fa-server"></i><span>Master</span></a>
      <a class="nav-item" onclick="switchPage('view-export', this)"><i class="fas fa-download"></i><span>Export</span></a>
    </nav>

    <script>
      // INISIALISASI LOCALFORAGE UNTUK PULUHAN RIBU DATA
      const DB_KEY = "MasterBarangFactory";
      let scannerEngine = null;
      let isScanning = false;
      let allData = [];

      // Dapatkan Tanggal Hari Ini (Format YYYY-MM-DD)
      function getTodayStr() {
        const d = new Date();
        return new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split("T")[0];
      }

      // LOAD DATA PADA SAAT APLIKASI DIBUKA
      async function initApp() {
        const stored = await localforage.getItem(DB_KEY);
        if (stored) allData = stored;
        
        // Logika Reset Jam 23:59 (Jika hari berganti, data tetap ada di master, 
        // tapi tampilan 'Hari Ini' secara otomatis hanya memfilter tanggal saat ini).
        // Tidak perlu menghapus data, cukup filter UI nya saja.
      }

      function switchPage(pageId, navElement) {
        if (pageId !== "view-scan" && isScanning) toggleScan();
        document.querySelectorAll(".view-page").forEach(p => p.classList.remove("active"));
        document.querySelectorAll(".nav-item").forEach(i => i.classList.remove("active"));
        document.getElementById(pageId).classList.add("active");
        navElement.classList.add("active");
        
        if (pageId === "view-session") renderToday();
        if (pageId === "view-database") renderDatabase();
      }

      // PERBAIKAN LOGIKA PANJANG & LEBAR
      function parsePayloadToFields(raw) {
        raw = (raw || "").trim();
        // Default values
        let res = { panjang: "-", lebar: "-", potongan: "-", golongan: raw.substring(0, 2) || "-" };
        
        if (raw.length >= 15) {
            try {
                // PERHATIAN: Sesuaikan angka negatif slice ini dengan format barcode aktual pabrik.
                // Misal format: [Golongan][Lainnya][Panjang 3 digit][Lebar 5 digit][Potongan 4 digit]
                res.potongan = parseInt(raw.slice(-4), 10);      // Ambil 4 digit terakhir
                res.lebar = parseInt(raw.slice(-9, -4), 10)/10;  // Ambil 5 digit sebelum potongan
                res.panjang = parseInt(raw.slice(-12, -9), 10);  // Ambil 3 digit sebelum lebar
            } catch(e) {
                console.log("Gagal memecah barcode spesifik");
            }
        }
        return res;
      }

      // HTML5-QRCODE ENGINE (SUPPORT IOS/ANDROID TINGGI)
      function toggleScan() {
        const btn = document.getElementById("btnAction");
        
        if (!scannerEngine) {
            scannerEngine = new Html5Qrcode("reader");
        }

        if (isScanning) {
            scannerEngine.stop().then(() => {
                isScanning = false;
                btn.innerHTML = '<i class="fas fa-play" style="margin-right: 6px"></i> MULAI SCAN';
                btn.classList.remove("stop");
            });
        } else {
            const config = { fps: 10, qrbox: { width: 250, height: 150 } };
            scannerEngine.start(
                { facingMode: "environment" }, 
                config,
                (decodedText) => processBarcode(decodedText),
                (errorMessage) => { /* Abaikan error frame kosong */ }
            ).then(() => {
                isScanning = true;
                btn.innerHTML = '<i class="fas fa-stop" style="margin-right: 6px"></i> STOP SCAN';
                btn.classList.add("stop");
            }).catch(err => {
                Swal.fire("Error", "Kamera tidak diizinkan atau tidak didukung browser ini.", "error");
            });
        }
      }

      function processBarcode(code) {
        if (allData.some(d => d.kode === code && d.tanggal === getTodayStr())) {
            // Cegah scan ganda di hari yang sama
            return;
        }
        
        const now = new Date();
        const parsed = parsePayloadToFields(code);
        
        const newData = {
            id: Date.now(),
            kode: code,
            panjang: parsed.panjang,
            lebar: parsed.lebar,
            potongan: parsed.potongan,
            tanggal: getTodayStr(),
            jam: now.toTimeString().split(" ")[0]
        };

        allData.push(newData);
        localforage.setItem(DB_KEY, allData);
        
        // Vibrate on success
        if(navigator.vibrate) navigator.vibrate(50);
        Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Tersimpan!', showConfirmButton: false, timer: 1000 });
      }

      function inputManual() {
        const input = document.getElementById("manualData");
        if(input.value) {
            processBarcode(input.value);
            input.value = "";
        }
      }

      // RENDER TABLE & SWIPE TO DELETE LOGIC
      function renderToday() {
        const tbody = document.getElementById("tableToday");
        const todayStr = getTodayStr();
        const fData = allData.filter(d => d.tanggal === todayStr).sort((a,b) => b.id - a.id);
        
        tbody.innerHTML = fData.map(d => `
          <tr>
            <td><button class="swipe-delete-btn" onclick="deleteData(${d.id})"><i class="fas fa-trash"></i></button></td>
            <td><strong>${d.kode}</strong></td>
            <td>${d.panjang}</td>
            <td>${d.lebar}</td>
            <td>${d.potongan}</td>
            <td>${d.jam.substring(0,5)}</td>
          </tr>
        `).join('') || `<tr><td colspan="6" style="text-align:center;">Belum ada data hari ini</td></tr>`;
      }

      function renderDatabase() {
        const tbody = document.getElementById("tableAll");
        const q = document.getElementById("search").value.toLowerCase();
        
        const fData = allData.filter(d => d.kode.toLowerCase().includes(q)).sort((a,b) => b.id - a.id);
        
        tbody.innerHTML = fData.map(d => `
          <tr>
            <td><button class="swipe-delete-btn" onclick="deleteData(${d.id})"><i class="fas fa-trash"></i></button></td>
            <td><strong>${d.kode}</strong></td>
            <td>${d.panjang}</td>
            <td>${d.lebar}</td>
            <td>${d.tanggal}</td>
            <td>${d.jam.substring(0,5)}</td>
          </tr>
        `).join('') || `<tr><td colspan="6" style="text-align:center;">Data tidak ditemukan</td></tr>`;
      }

      function deleteData(id) {
        Swal.fire({
            title: "Hapus?", text: "Data akan dihapus permanen.", icon: "warning",
            showCancelButton: true, confirmButtonColor: "#ef4444", confirmButtonText: "Hapus"
        }).then((res) => {
            if (res.isConfirmed) {
                allData = allData.filter(d => d.id !== id);
                localforage.setItem(DB_KEY, allData);
                renderToday(); renderDatabase();
            }
        });
      }

      // EXPORT LOGIC
      function exportData(type, scope) {
        const todayStr = getTodayStr();
        const dataToExport = scope === 'today' ? allData.filter(d => d.tanggal === todayStr) : allData;
        
        if(dataToExport.length === 0) return Swal.fire("Kosong", "Tidak ada data untuk diekspor", "info");

        if (type === 'excel') {
            const ws = XLSX.utils.json_to_sheet(dataToExport);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Data");
            XLSX.writeFile(wb, `Laporan_Scanner_${scope}_${todayStr}.xlsx`);
        } else if (type === 'pdf') {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            const tableColumn = ["Kode", "Panjang", "Lebar", "Potongan", "Tanggal", "Jam"];
            const tableRows = dataToExport.map(d => [d.kode, d.panjang, d.lebar, d.potongan, d.tanggal, d.jam]);

            doc.text(`Laporan Master Barang (${scope === 'today' ? 'Hari Ini' : 'Semua'})`, 14, 15);
            doc.autoTable({ head: [tableColumn], body: tableRows, startY: 20 });
            doc.save(`Laporan_Scanner_${scope}_${todayStr}.pdf`);
        }
      }

      window.onload = initApp;
    </script>
  </body>
</html>
