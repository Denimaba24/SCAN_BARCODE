<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Scanner Enterprise 1D</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Library Inti -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #0f172a;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--bg-body); color: var(--text-main); padding-bottom: 30px; }

        /* Navbar Native App Look */
        .navbar {
            background: var(--primary);
            color: white;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 1024px) {
            .container { grid-template-columns: 400px 1fr; align-items: start; }
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        /* --- UI CUSTOM SCANNER --- */
        .scanner-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #reader { width: 100%; min-height: 250px; background: #000; }
        #reader video { object-fit: cover; }

        .scanner-controls {
            width: 100%;
            padding: 20px;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }

        /* Tombol Utama Scan */
        .btn-scan-action {
            flex: 1;
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        }
        .btn-scan-action:active { transform: scale(0.96); }
        .btn-scan-action.stop { background: var(--danger); box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3); }

        /* Icon Switch Camera */
        .btn-switch-cam {
            background: #f1f5f9;
            color: var(--text-main);
            border: 1px solid var(--border);
            width: 55px;
            height: 55px;
            border-radius: 12px;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .btn-switch-cam:active { background: #e2e8f0; transform: rotate(180deg); }

        /* Status Text */
        .scan-status {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 500;
        }

        /* Forms & Table (Sama seperti sebelumnya namun disempurnakan) */
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            margin-top: 5px;
        }
        
        .toolbar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-export {
            background: var(--success);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
        th { background: #f1f5f9; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; }
        
        .badge-barcode {
            background: #e0e7ff; color: var(--primary);
            padding: 5px 10px; border-radius: 6px;
            font-family: monospace; font-weight: 700;
        }

        .btn-del {
            background: #fee2e2; color: var(--danger);
            border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer;
        }

        @keyframes flashSuccess {
            0% { background-color: rgba(16, 185, 129, 0.4); }
            100% { background-color: var(--bg-body); }
        }
        .flash-success { animation: flashSuccess 0.6s ease-out; }
    </style>
</head>
<body>

    <nav class="navbar">
        <i class="fas fa-barcode" style="margin-right: 10px;"></i> Master Scanner
    </nav>

    <div class="container">
        <!-- Area Scanner -->
        <div class="card">
            <div class="scan-status" id="statusText"><i class="fas fa-info-circle"></i> Kamera Standby. Tekan MULAI SCAN.</div>
            
            <div class="scanner-wrapper">
                <div id="reader"></div>
            </div>

            <div class="scanner-controls">
                <button class="btn-switch-cam" onclick="switchCamera()" title="Putar Kamera">
                    <i class="fas fa-camera-rotate"></i>
                </button>
                <button class="btn-scan-action" id="btnToggleScan" onclick="toggleScanner()">
                    <i class="fas fa-play"></i> MULAI SCAN
                </button>
            </div>
            
            <!-- Input Manual Darurat -->
            <div style="margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px;">
                <label style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted);">Input Manual (Bila Fisik Rusak)</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="manualInput" class="form-control" placeholder="Ketik kode...">
                    <button class="btn-export" style="width: auto; background: var(--primary); margin-top: 5px;" onclick="inputManual()">Input</button>
                </div>
            </div>
        </div>

        <!-- Area Data -->
        <div class="card">
            <h3 style="font-size: 1.1rem; margin-bottom: 15px; color: var(--text-main);"><i class="fas fa-database"></i> Database Harian</h3>
            
            <div class="toolbar">
                <div>
                    <label style="font-size: 0.8rem;">Tanggal Awal</label>
                    <input type="date" class="form-control" id="startDate" onchange="renderTable()">
                </div>
                <div>
                    <label style="font-size: 0.8rem;">Tanggal Akhir</label>
                    <input type="date" class="form-control" id="endDate" onchange="renderTable()">
                </div>
                <div>
                    <label style="font-size: 0.8rem;">Cari Barcode</label>
                    <input type="text" class="form-control" id="searchBox" placeholder="Cari..." onkeyup="renderTable()">
                </div>
                <div style="display: flex; align-items: flex-end;">
                    <button class="btn-export" onclick="exportExcel()">
                        <i class="fas fa-file-excel"></i> Export
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Kode Barcode</th>
                            <th>P x L</th>
                            <th>Potongan</th>
                            <th>Persegi</th>
                            <th>Tgl Scan</th>
                            <th>Jam</th>
                            <th>Gol</th>
                            <th>Hapus</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div id="dataInfo" style="margin-top: 15px; font-size: 0.85rem; color: var(--text-muted); text-align: right;"></div>
        </div>
    </div>

<script>
    // --- 1. INISIALISASI CORE SCANNER ---
    let html5QrCode = new Html5Qrcode("reader");
    let isScanning = false;
    let currentFacingMode = "environment"; // Default kamera belakang (environment)
    let lastScannedCode = null;
    let masterData = JSON.parse(localStorage.getItem('ScanMasterData')) || [];

    const Toast = Swal.mixin({
        toast: true, position: 'bottom-end', showConfirmButton: false, timer: 2000
    });

    // --- 2. FUNGSI AUDIO & GETAR (HP) ---
    function triggerSuccessHardware() {
        if (navigator.vibrate) navigator.vibrate(200);
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.type = 'sine';
        oscillator.frequency.value = 900;
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.01);
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.15);
    }

    // --- 3. KONTROL KAMERA MANUAL ---
    function toggleScanner() {
        const btn = document.getElementById('btnToggleScan');
        const statusText = document.getElementById('statusText');

        if (isScanning) {
            // Matikan Kamera
            html5QrCode.stop().then(() => {
                isScanning = false;
                btn.innerHTML = '<i class="fas fa-play"></i> MULAI SCAN';
                btn.classList.remove('stop');
                statusText.innerHTML = '<i class="fas fa-info-circle"></i> Kamera Standby.';
            }).catch(err => console.log("Error stopping scanner", err));
        } else {
            // Nyalakan Kamera
            startScannerProcess();
        }
    }

    function switchCamera() {
        if (isScanning) {
            html5QrCode.stop().then(() => {
                currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
                startScannerProcess();
            });
        } else {
            currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
            Toast.fire({ icon: 'info', title: currentFacingMode === 'environment' ? 'Kamera Belakang Siap' : 'Kamera Depan Siap' });
        }
    }

    function startScannerProcess() {
        const btn = document.getElementById('btnToggleScan');
        const statusText = document.getElementById('statusText');

        // Konfigurasi khusus membaca 1D barcode di HP
        const config = { 
            fps: 15, 
            qrbox: { width: 300, height: 120 }, // Area pipih mendatar khusus 1D
            formatsToSupport: [ 
                Html5QrcodeSupportedFormats.EAN_13, 
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39 
            ] 
        };

        html5QrCode.start(
            { facingMode: currentFacingMode },
            config,
            onScanSuccess,
            (errorMessage) => { /* Abaikan error pencarian fokus lensa */ }
        ).then(() => {
            isScanning = true;
            btn.innerHTML = '<i class="fas fa-stop"></i> BERHENTI SCAN';
            btn.classList.add('stop');
            statusText.innerHTML = '<span style="color: var(--success);"><i class="fas fa-circle" style="font-size:8px;"></i> Scanner Aktif</span> (Arahkan garis barcode ke dalam kotak)';
        }).catch((err) => {
            Swal.fire('Error Kamera', 'Pastikan izin kamera browser sudah aktif.', 'error');
        });
    }

    // --- 4. LOGIKA DATA BARCODE ---
    function onScanSuccess(decodedText) {
        if(lastScannedCode === decodedText) return; // Anti-spam 2.5 detik
        lastScannedCode = decodedText;
        setTimeout(() => lastScannedCode = null, 2500);

        simpanData(decodedText);
    }

    function inputManual() {
        const input = document.getElementById('manualInput');
        if(!input.value.trim()) return Toast.fire({ icon: 'warning', title: 'Kode Kosong!' });
        simpanData(input.value.trim());
        input.value = '';
    }

    function simpanData(kode) {
        const now = new Date();
        const tgl = now.toISOString().split('T')[0];
        const jam = now.toTimeString().split(' ')[0];

        const newData = {
            id: Date.now(),
            kode: kode,
            panjang: 280, // Dummy sesuai foto
            lebar: 18,
            potongan: 24,
            persegi: 12.1,
            tanggal: tgl,
            jam: jam,
            golongan: 'A'
        };

        masterData.unshift(newData);
        localStorage.setItem('ScanMasterData', JSON.stringify(masterData));
        
        triggerSuccessHardware();
        document.body.classList.add('flash-success');
        setTimeout(() => document.body.classList.remove('flash-success'), 600);
        
        Toast.fire({ icon: 'success', title: `Masuk: ${kode}` });
        renderTable();
    }

    // --- 5. RENDER & EXPORT DATA ---
    function renderTable() {
        const tbody = document.getElementById('tableBody');
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        const search = document.getElementById('searchBox').value.toLowerCase();

        let filtered = masterData.filter(item => {
            let match = true;
            if (start && item.tanggal < start) match = false;
            if (end && item.tanggal > end) match = false;
            if (search && !item.kode.toLowerCase().includes(search)) match = false;
            return match;
        });

        // Urutkan terbaru di atas
        filtered.sort((a, b) => new Date(b.tanggal + 'T' + b.jam) - new Date(a.tanggal + 'T' + a.jam));

        tbody.innerHTML = '';
        if(filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:20px;">Belum ada data scan</td></tr>`;
        } else {
            filtered.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td><span class="badge-barcode">${item.kode}</span></td>
                    <td>${item.panjang} x ${item.lebar}</td>
                    <td>${item.potongan}</td>
                    <td>${item.persegi}</td>
                    <td>${formatTgl(item.tanggal)}</td>
                    <td>${item.jam}</td>
                    <td><b>${item.golongan}</b></td>
                    <td><button class="btn-del" onclick="hapus(${item.id})"><i class="fas fa-trash"></i></button></td>
                `;
                tbody.appendChild(tr);
            });
        }
        document.getElementById('dataInfo').innerText = `Total: ${filtered.length} Data`;
    }

    function formatTgl(tglStr) {
        const parts = tglStr.split('-');
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function hapus(id) {
        Swal.fire({
            title: 'Hapus?', text: "Data hilang permanen dari lokal.", icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Hapus'
        }).then((res) => {
            if (res.isConfirmed) {
                masterData = masterData.filter(i => i.id !== id);
                localStorage.setItem('ScanMasterData', JSON.stringify(masterData));
                renderTable();
            }
        });
    }

    function exportExcel() {
        if(masterData.length === 0) return Swal.fire('Kosong', 'Tidak ada data!', 'warning');
        
        const excelData = masterData.map((item, index) => ({
            "No": index + 1, "Kode Barcode": item.kode, "Panjang": item.panjang, "Lebar": item.lebar,
            "Jml Potongan": item.potongan, "Persegi": item.persegi, "Tanggal": formatTgl(item.tanggal),
            "Jam": item.jam, "Golongan": item.golongan
        }));

        const worksheet = XLSX.utils.json_to_sheet(excelData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Master Barang");
        XLSX.writeFile(workbook, `Data_Scanner_${new Date().getTime()}.xlsx`);
    }

    window.onload = renderTable;
</script>

</body>
</html>
